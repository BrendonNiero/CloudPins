receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus/cadvisor:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 15s
          static_configs:
            - targets:
                - cadvisor:8080

processors:
  batch:
    timeout: 5s
    send_batch_size: 100

  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  elasticsearch:
    endpoints:
      - http://elasticsearch:9200
    logs_index: cloudpins-otel-logs
    metrics_index: cloudpins-otel-metrics
    traces_index: cloudpins-otel-traces

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - resource
        - batch
      exporters:
        - elasticsearch
        - debug

    metrics:
      receivers:
        - otlp
        - prometheus/cadvisor
      processors:
        - resource
        - batch
      exporters:
        - elasticsearch
        - debug

    logs:
      receivers:
        - otlp
      processors:
        - resource
        - batch
      exporters:
        - elasticsearch
        - debug
