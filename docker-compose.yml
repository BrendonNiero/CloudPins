services:
  postgres:
    image: postgres:16
    container_name: cloudpins_postgres
    restart: always
    environment:
      POSTGRES_DB: cloudpins
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudpins"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: cloudpins_elasticsearch
    restart: always
    environment: 
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: CloudPins.Api/Dockerfile
    container_name: cloudpins_api
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5023:8080"
    volumes:
      - uploads_data:/app/storage

  frontend:
    build:
      context: ./CloudPins.App
    container_name: cloudpins_frontend
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  uploads_data:
  elasticsearch_data: