services:
  postgres:
    image: postgres:16
    container_name: cloudpins_postgres
    restart: always
    environment:
      POSTGRES_DB: cloudpins
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudpins"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: cloudpins_elasticsearch
    restart: always
    environment: 
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch-init:
    image: curlimages/curl:8.10.1
    container_name: cloudpins_elasticsearch_init
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./docker/elasticsearch/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: cloudpins_kibana
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: cloudpins_otel_collector
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
    command:
      - "--config=/etc/otelcol-contrib/otel-collector-config.yml"
    volumes:
      - ./docker/otel/otel-collector-config.yml:/etc/otelcol-contrib/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"    

  api:
    build:
      context: .
      dockerfile: CloudPins.Api/Dockerfile
    container_name: cloudpins_api
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    ports:
      - "5023:8080"
    volumes:
      - uploads_data:/app/storage

  frontend:
    build:
      context: ./CloudPins.App
    container_name: cloudpins_frontend
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  uploads_data:
  elasticsearch_data:
